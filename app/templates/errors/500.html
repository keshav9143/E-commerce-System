{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}

  <i class="bi bi-exclamation-octagon display-1 text-danger mb-3"></i>
  <h1 class="display-5 fw-bold">500 — Internal Server Error</h1>
  <p class="lead text-muted">

  </a>
</div>
{% endblock %}
